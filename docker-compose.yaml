x-frontend-image: &frontend-image bookshelf-nginx:1.2.0
x-backend-image: &backend-image bookshelf:1.2.0
x-index-meta-proxy-image: &index-meta-proxy-image bookshelf-index-meta-proxy:1.2.0
x-logging: &logging
  options:
    max-size: "10m"
    max-file: "3"

x-common-environment: &common-environment
  TZ: ${TZ:-UTC}

services:

  nginx:
    image: *frontend-image
    build: frontend
    restart: always
    logging: *logging
    environment:
      <<: *common-environment
    ports:
      - "${BIND_HOST:-0.0.0.0}:${BIND_PORT_HTTP:-80}:80"
      - "${BIND_HOST:-0.0.0.0}:${BIND_PORT_HTTPS:-443}:443"
    volumes:
      - "${NGINX_CONFIG:-./config/nginx/frontend.conf}:/etc/nginx/conf.d/default.conf:ro"
      - "./media/previews:/var/www/media/previews:ro"
    #      - "${CERT_DIR:-/etc/letsencrypt/live/it-bookshelf.ru/}/fullchain.pem:/etc/ssl/fullchain.pem:ro"
    #      - "${CERT_DIR:-/etc/letsencrypt/live/it-bookshelf.ru/}/privkey.pem:/etc/ssl/privkey.pem:ro"
    #      - "${DH_PARAMS:-/etc/letsencrypt/ssl-dhparams.pem}:/etc/ssl/ssl-dhparams.pem:ro"
    depends_on:
      api-1:
        condition: service_started
    networks:
      - frontend

  api-1: &backend
    build: .
    image: *backend-image
    command: /bin/sh run.sh
    restart: always
    logging: *logging
    environment:
      <<: *common-environment
      CELERY_BROKER_URL: "redis://redis:6379/1"
      REDIS_HOST: "redis"
      REDIS_DB: 0
    env_file:
      - config/env/api
    volumes:
      - "./media:/app/media"
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - frontend
      - backend

  index-meta-proxy:
    build: index-meta-proxy
    image: *index-meta-proxy-image
    restart: always
    logging: *logging
    environment:
      <<: *common-environment
      API_URL: "${BASE_URL:-https://it-bookshelf.ru}"
    depends_on:
      - nginx
    networks:
      - frontend

  celery-worker:
    <<: *backend
    command: celery -A src.infrastructure.celery.celery worker --loglevel=info
    logging: *logging
    healthcheck:
      test: .
      disable: true
    depends_on:
      redis:
        condition: service_started
      database:
        condition: service_healthy
    networks:
      - backend
    ports: [ ]

  redis:
    image: redis:8.0-alpine
    restart: always
    environment:
      <<: *common-environment
    logging: *logging
    networks:
      - backend

  database:
    image: postgres:18.4-alpine
    restart: always
    environment:
      <<: *common-environment
    env_file:
      - config/env/postgres
    logging: *logging
    volumes:
      - "./pg_data:/var/lib/postgresql/18/docker"
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U dbuser -d bookshelf'" ]
      start_period: 5s
      timeout: 10s
      interval: 5s
      retries: 5
    networks:
      - backend

  pgadmin-balancer:
    image: nginx:1.31.2-alpine
    restart: always
    profiles: [ "pgadmin" ]
    environment:
      <<: *common-environment
    logging: *logging
    ports:
      - "8080:8080"
    volumes:
      - "${PG_ADMIN_NGINX_CONFIG:-./config/nginx/pgadmin.conf}:/etc/nginx/conf.d/default.conf:ro"
    #      - "${CERT_DIR:-/etc/letsencrypt/live/it-bookshelf.ru}/fullchain.pem:/etc/ssl/fullchain.pem:ro"
    #      - "${CERT_DIR:-/etc/letsencrypt/live/it-bookshelf.ru}/privkey.pem:/etc/ssl/privkey.pem:ro"
    #      - "${DH_PARAMS:-/etc/letsencrypt/ssl-dhparams.pem}:/etc/ssl/ssl-dhparams.pem:ro"
    depends_on:
      pgadmin4:
        condition: service_started
    networks:
      - mgmt

  pgadmin4:
    image: elestio/pgadmin:latest
    profiles: [ "pgadmin" ]
    environment:
      <<: *common-environment
    restart: always
    env_file:
      - config/env/pgadmin
    logging: *logging
    depends_on:
      database:
        condition: service_healthy
    networks:
      - mgmt
      - backend

networks:
  frontend:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: ${FRONTEND_IPV4_NETWORK:-172.22.1.0/24}
        - subnet: ${FRONTEND_IPV6_NETWORK:-fd4d:6169:6c63:6f76::/64}

  backend:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: ${BACKEND_IPV4_NETWORK:-172.22.2.0/24}
        - subnet: ${BACKEND_IPV6_NETWORK:-fd4d:6169:6c63:6f77::/64}

  mgmt:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: ${MGMT_IPV4_NETWORK:-172.22.3.0/24}
        - subnet: ${MGMT_IPV6_NETWORK:-fd4d:6169:6c63:6f78::/64}
