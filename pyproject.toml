[project]
name = "src"
version = "1"
description = "Сайт книг для IT специалистов"
authors = [{ name = "ig-rudenko", email = "ig.rudenko1@yandex.ru" }]
requires-python = ">=3.14,<4.0"
readme = "README.md"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "sqlalchemy>=2.0.51",
    "alembic>=1.19.1",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "PyMuPDF>=1.28.2",
    "pydantic-settings>=2.15.0",
    "asyncpg>=0.31.0",
    "aiofiles>=25.1.0",
    "python-slugify>=8.0.4",
    "redis[hiredis]>=8.1.0",
    "celery>=5.6.3",
    "aiohttp>=3.14.3",
    "loguru>=0.7.3",
    "aioboto3>=15.5.0",
    "advanced-alchemy>=1.11.0",
    "orjson>=3.11.9",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "coverage>=7.15.4",
    "black>=26.5.1",
    "mypy>=2.3.0",
    "types-aiofiles>=25.1.0.20260518",
    "celery-types>=0.26.0",
    "pydeps>=3.0.7",
    "graphviz>=0.21",
    "types-aioboto3>=15.5.0",
    "boto3-stubs~=1.43.67",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.black]
line-length = 110
target-version = ["py314"]

[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "C", # mccabe
    "E", # pycodestyle
    "F", # Pyflakes
    "I", # isort
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "RSE", # flake8-raise
    "UP", # pyupgrade
    "W", # pycodestyle
]
ignore = [
    "C408", # Unnecessary collection call
    "C901", # Functions with a high complexity
    "E402", # Module level import not at top of file
    "E501", # Line too long
    "SIM108", # Use ternary operator instead of `if`-`else`-block
    "W291", # Trailing whitespace
    "W293", # Blank line contains whitespace
]
