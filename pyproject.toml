[project]
name = "src"
version = "1"
description = "Сайт книг для IT специалистов"
authors = [{ name = "ig-rudenko", email = "ig.rudenko1@yandex.ru" }]
requires-python = ">=3.12,<4.0"
readme = "README.md"
dependencies = [
    "fastapi>=0.138.2",
    "uvicorn>=0.49.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
    "pillow>=12.2.0",
    "python-multipart>=0.0.32",
    "PyMuPDF>=1.28.0",
    "pydantic-settings>=2.14.2",
    "asyncpg>=0.31.0",
    "aiofiles>=25.1.0",
    "python-slugify>=8.0.4",
    "redis[hiredis]>=8.0.1",
    "celery>=5.6.3",
    "aiohttp>=3.14.1",
    "loguru>=0.7.3",
    "aioboto3>=15.5.0",
    "advanced-alchemy>=1.11.0",
    "orjson>=3.11.9",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "coverage>=7.14.3",
    "black>=26.5.1",
    "mypy>=2.1.0",
    "types-aiofiles>=25.1.0.20260518",
    "celery-types>=0.26.0",
    "pydeps>=3.0.6",
    "graphviz>=0.21",
    "types-aioboto3>=15.5.0",
    "boto3-stubs~=1.40.61",
]

[tool.uv]
default-groups = [
    "dev",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
lint.flake8-bugbear.extend-immutable-calls = ["Depends", "fastapi.Depends", "fastapi.params.Depends"]
lint.extend-select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
lint.ignore = [
    # Line too long
    "E501",
    # Functions with a high complexity
    "C901",
    # Use ternary operator instead of `if`-`else`-block
    "SIM108",
    # Module level import not at top of file
    "E402"
]

[tool.black]
line-length = 110
target-version = ["py312"]
